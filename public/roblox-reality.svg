<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Pretendard', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="400" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Roblox Reality의 세 가지 구성 요소</text>

  <!-- engine -->
  <rect x="50" y="70" width="310" height="130" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="205" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">게임엔진 — "무엇이 있는가"</text>
  <text x="205" y="124" text-anchor="middle" font-size="12.5" fill="#334155">데이터 모델: 모든 객체와 속성의 장부</text>
  <text x="205" y="146" text-anchor="middle" font-size="12.5" fill="#334155">(차의 위치·속도·방향·재질)</text>
  <text x="205" y="172" text-anchor="middle" font-size="12.5" fill="#334155">물리와 규칙을 매번 똑같이 계산 → 진실의 원천</text>

  <!-- upsampler -->
  <rect x="440" y="70" width="310" height="130" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="595" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">Super Upsampler — "어떻게 보이는가"</text>
  <text x="595" y="124" text-anchor="middle" font-size="12.5" fill="#334155">엔진이 그린 밋밋한 프레임을 받아</text>
  <text x="595" y="146" text-anchor="middle" font-size="12.5" fill="#334155">질감·조명·디테일을 입혀 포토리얼로</text>
  <text x="595" y="172" text-anchor="middle" font-size="12.5" fill="#334155">장면을 정하지 않는다, 보이는 것만 맡는다</text>

  <!-- arrow between -->
  <line x1="360" y1="135" x2="430" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="395" y="120" text-anchor="middle" font-size="11" fill="#64748b">초안 프레임</text>
  <text x="395" y="156" text-anchor="middle" font-size="11" fill="#64748b">+ 조건 신호</text>

  <!-- cloud -->
  <rect x="50" y="240" width="700" height="90" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Roblox 클라우드 — 이 모든 걸 스케일로 돌리는 기반</text>
  <text x="400" y="296" text-anchor="middle" font-size="12.5" fill="#334155">세계의 상태를 영구 저장 (며칠 뒤 돌아와도 게임이 그대로) · 수백만 세션을 플레이어 가까운 데이터센터에서 실행</text>
  <text x="400" y="316" text-anchor="middle" font-size="12.5" fill="#334155">권위 있는 상태가 플레이어 옆에 있어야 빠르고 공정한 멀티플레이가 가능하다</text>

  <line x1="205" y1="200" x2="205" y2="238" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="595" y1="200" x2="595" y2="238" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="400" y="368" text-anchor="middle" font-size="12.5" fill="#334155">엔진과 클라우드가 <tspan font-weight="700">일관성</tspan>을 지키고, 월드모델이 <tspan font-weight="700">사실감</tspan>을 맡는다</text>
</svg>
