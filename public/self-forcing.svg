<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Pretendard', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- offline -->
  <text x="60" y="45" font-size="15" font-weight="700" fill="#b45309">기존 방식 (오프라인 생성)</text>
  <rect x="60" y="60" width="500" height="70" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="90" text-anchor="middle" font-size="13" fill="#334155">클립 전체를 한 번에 생성 — 시간을 앞뒤로 오가며 계산</text>
  <text x="310" y="112" text-anchor="middle" font-size="12" fill="#64748b">다 만들 때까지 아무것도 볼 수 없다</text>
  <rect x="590" y="72" width="150" height="46" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="665" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">클립당 수 초</text>
  <text x="665" y="110" text-anchor="middle" font-size="11" fill="#b91c1c">게임에는 못 쓴다</text>

  <!-- self-forcing -->
  <text x="60" y="185" font-size="15" font-weight="700" fill="#4338ca">Self-forcing (자기회귀 생성)</text>
  <rect x="60" y="200" width="110" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="115" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">프레임 1</text>
  <line x1="170" y1="230" x2="215" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <rect x="220" y="200" width="110" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="275" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">프레임 2</text>
  <line x1="330" y1="230" x2="375" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <rect x="380" y="200" width="110" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="435" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">프레임 3</text>
  <line x1="490" y1="230" x2="535" y2="230" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow5)"/>
  <text x="558" y="236" font-size="16" fill="#64748b">…</text>
  <text x="300" y="285" text-anchor="middle" font-size="12" fill="#64748b">각 프레임이 방금 만든 프레임들을 조건으로 곧바로 생성 → 스트리밍 가능</text>
  <rect x="590" y="205" width="150" height="50" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="665" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">프레임당 ~30ms</text>
  <text x="665" y="245" text-anchor="middle" font-size="11" fill="#15803d">실시간 목표</text>

  <!-- levers -->
  <rect x="60" y="310" width="680" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="400" y="332" text-anchor="middle" font-size="12.5" fill="#334155">함께 쓰는 지연시간 레버: 모델 소형화 · KV 캐시 압축 · 엣지 데이터센터의 H200/B200급 GPU · 엔진 인스턴스 바로 옆에 배치</text>
  <text x="400" y="352" text-anchor="middle" font-size="11.5" fill="#64748b">네트워크 왕복까지 포함해 수 초를 수십 밀리초로 줄이는 싸움</text>
</svg>
