<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="'Times New Roman', Times, serif" font-size="20">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="820" height="330" fill="#ffffff"/>
  <!-- (a) 나이브 베이즈 -->
  <rect x="40" y="130" width="250" height="155" rx="10" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="190" y="25" width="170" height="240" rx="10" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="280" y="278" text-anchor="end" font-style="italic">m</text>
  <text x="350" y="257" text-anchor="end" font-style="italic">d</text>
  <circle cx="70" cy="60" r="5" fill="#222"/>
  <text x="58" y="50" text-anchor="end" font-style="italic">π</text>
  <circle cx="300" cy="72" r="5" fill="#222"/>
  <text x="312" y="66" font-style="italic">θ<tspan font-size="14" dy="6">i</tspan></text>
  <circle cx="110" cy="215" r="24" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="104" y="221" text-anchor="middle" font-style="italic">y<tspan font-size="14" dy="6">j</tspan></text>
  <circle cx="245" cy="215" r="24" fill="#bcd3ea" stroke="#222" stroke-width="1.5"/>
  <text x="238" y="221" text-anchor="middle" font-style="italic">x<tspan font-size="14" dy="6">j,i</tspan></text>
  <line x1="72" y1="66" x2="102" y2="190" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="134" y1="215" x2="219" y2="215" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="296" y1="78" x2="256" y2="192" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="320" text-anchor="middle" font-family="sans-serif" font-size="17">(a)</text>
  <!-- (b) 체인식 조건 랜덤 필드 -->
  <rect x="440" y="95" width="350" height="200" rx="10" fill="none" stroke="#222" stroke-width="1.5"/>
  <rect x="470" y="115" width="300" height="100" rx="10" fill="none" stroke="#222" stroke-width="1.5"/>
  <text x="780" y="288" text-anchor="end" font-style="italic">m</text>
  <text x="762" y="207" text-anchor="end" font-style="italic" font-size="17">i = 1, …, n−1</text>
  <circle cx="520" cy="45" r="5" fill="#222"/>
  <text x="508" y="40" text-anchor="end" font-style="italic">μ</text>
  <circle cx="640" cy="45" r="5" fill="#222"/>
  <text x="652" y="40" font-style="italic">λ</text>
  <line x1="521" y1="51" x2="536" y2="137" stroke="#222" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="640" y1="51" x2="605" y2="157" stroke="#222" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="564" y1="160" x2="646" y2="160" stroke="#222" stroke-width="1.5"/>
  <circle cx="540" cy="160" r="24" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="535" y="166" text-anchor="middle" font-style="italic">y<tspan font-size="14" dy="6">i</tspan></text>
  <circle cx="670" cy="160" r="24" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <text x="669" y="166" text-anchor="middle" font-style="italic">y<tspan font-size="12" dy="6">i+1</tspan></text>
  <circle cx="605" cy="255" r="24" fill="#bcd3ea" stroke="#222" stroke-width="1.5"/>
  <text x="605" y="262" text-anchor="middle" font-weight="bold">x</text>
  <line x1="552" y1="181" x2="592" y2="234" stroke="#222" stroke-width="1.5"/>
  <line x1="658" y1="181" x2="618" y2="234" stroke="#222" stroke-width="1.5"/>
  <text x="605" y="320" text-anchor="middle" font-family="sans-serif" font-size="17">(b)</text>
</svg>
