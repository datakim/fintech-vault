<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Pretendard', 'Noto Sans KR', sans-serif">
  <rect x="0" y="0" width="800" height="380" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="400" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">게임을 게임으로 만드는 두 가지 일</text>

  <!-- left: consistency -->
  <rect x="50" y="65" width="330" height="235" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="215" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">① 세계를 일관되게 유지하기</text>
  <rect x="72" y="112" width="286" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="215" y="132" text-anchor="middle" font-size="12.5" fill="#334155">지속 상태 — 돌아와도 세계가 그대로 있다</text>
  <rect x="72" y="148" width="286" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="215" y="168" text-anchor="middle" font-size="12.5" fill="#334155">규칙 — 누구에게나 같은 방식으로 적용</text>
  <rect x="72" y="184" width="286" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="215" y="204" text-anchor="middle" font-size="12.5" fill="#334155">물리 — 기대한 대로 움직이고 부딪히고 떨어진다</text>
  <rect x="72" y="220" width="286" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="215" y="240" text-anchor="middle" font-size="12.5" fill="#334155">실시간 동기화 — 수천 명이 하나의 세계를 공유</text>
  <rect x="72" y="256" width="286" height="30" rx="6" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="215" y="276" text-anchor="middle" font-size="12.5" fill="#334155">즉각 반응 — 행동하는 순간 세계가 반응한다</text>

  <!-- right: realism -->
  <rect x="420" y="65" width="330" height="235" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="585" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">② 진짜처럼 보이게 하기</text>
  <rect x="442" y="112" width="286" height="30" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="585" y="132" text-anchor="middle" font-size="12.5" fill="#334155">바람에 흔들리는 풀</text>
  <rect x="442" y="148" width="286" height="30" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="585" y="168" text-anchor="middle" font-size="12.5" fill="#334155">차 뒤로 이는 먼지, 불에서 피어오르는 연기</text>
  <rect x="442" y="184" width="286" height="30" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="585" y="204" text-anchor="middle" font-size="12.5" fill="#334155">표면을 따라 변하는 빛</text>
  <rect x="442" y="220" width="286" height="66" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="585" y="246" text-anchor="middle" font-size="12.5" fill="#334155">플레이어가 이제는 당연하게</text>
  <text x="585" y="266" text-anchor="middle" font-size="12.5" fill="#334155">기대하는 수준의 사실감</text>

  <text x="400" y="330" text-anchor="middle" font-size="13.5" fill="#334155">게임엔진은 ①에 강하고, 월드모델은 ②에 강하다 — 둘을 동시에, 싸게 해낸 플랫폼은 아직 없다</text>
  <text x="400" y="358" text-anchor="middle" font-size="12" fill="#94a3b8">그래픽은 눈에 띄는 부분일 뿐, 게임을 게임으로 만드는 건 보이지 않는 시스템이다</text>
</svg>
