<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Pretendard', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- inputs -->
  <text x="120" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">조건 신호 (입력)</text>
  <rect x="40" y="62" width="160" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="89" text-anchor="middle" font-size="14" fill="#334155">시작 이미지</text>
  <rect x="40" y="118" width="160" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="120" y="145" text-anchor="middle" font-size="14" fill="#334155">텍스트 프롬프트</text>
  <rect x="40" y="174" width="160" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="120" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">플레이어 입력</text>
  <text x="120" y="211" text-anchor="middle" font-size="11" fill="#6366f1">(앞으로 가기, 카메라 회전)</text>

  <line x1="200" y1="84" x2="300" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="140" x2="300" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="196" x2="300" y2="170" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <!-- model -->
  <rect x="310" y="100" width="200" height="100" rx="12" fill="#4f46e5"/>
  <text x="410" y="143" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">비디오 월드모델</text>
  <text x="410" y="168" text-anchor="middle" font-size="12" fill="#c7d2fe">"다음에 어떤 장면이 와야 하는가"</text>

  <!-- output -->
  <line x1="510" y1="150" x2="600" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="610" y="112" width="150" height="76" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="685" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">다음 프레임</text>
  <text x="685" y="167" text-anchor="middle" font-size="11" fill="#475569">한 번에 한 장씩 생성</text>

  <!-- feedback loop -->
  <path d="M 685 188 L 685 258 L 410 258 L 410 208" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="548" y="278" text-anchor="middle" font-size="12" fill="#64748b">방금 만든 프레임이 다시 다음 프레임의 입력이 된다</text>

  <text x="400" y="318" text-anchor="middle" font-size="12" fill="#94a3b8">비디오 월드모델의 기본 구조: 조건 신호를 받아 프레임을 한 장씩 예측한다</text>
</svg>
